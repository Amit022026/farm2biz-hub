# ===== Server =====
server.port=8080

# ===== Database connection =====
spring.datasource.url=jdbc:mysql://localhost:3306/farmbiz_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
# ddl-auto=update: Hibernate looks at our @Entity classes and automatically
# creates/updates matching tables for us. Great for learning; in a real
# production app you'd switch to proper migration scripts later (Flyway/Liquibase).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== JWT=====
# This secret key is used to digitally "sign" every token we issue, so we
# can later prove a token wasn't tampered with. In a REAL project this
# would come from an environment variable, never committed to Git.
jwt.secret=c2VjcmV0LWtleS1mb3ItZmFybTJiaXotand0LWNoYW5nZS1pbi1wcm9kdWN0aW9u
# Token lifetime in milliseconds: 86400000 = 24 hours
jwt.expiration=86400000