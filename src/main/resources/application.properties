# ===== Server =====
server.port=8080

# ===== Database connection =====
spring.datasource.url=jdbc:mysql://localhost:3306/farmbiz_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
# ddl-auto=update: Hibernate looks at our @Entity classes and automatically
# creates/updates matching tables for us. Great for learning; in a real
# production app you'd switch to proper migration scripts later (Flyway/Liquibase).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
